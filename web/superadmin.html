<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Admin sign-in — Resume Parser API</title>
<link rel="stylesheet" href="/static/styles.css">
</head>
<body class="admin-theme">

<div class="auth-shell">
  <div class="auth-card">
    <div class="auth-head">
      <div class="brand">
        <span class="brand-mark">⚡</span>
        Resume Parser
      </div>
      <span class="badge badge-warn" style="margin-bottom:14px">System administrator</span>
      <h1>Admin sign-in</h1>
      <p class="dim" style="margin:0">
        Restricted console. Customer accounts should use the
        <a href="/login">normal login</a>.
      </p>
    </div>

    <div id="msg" class="hide"></div>

    <form id="login-form" novalidate>
      <div class="field">
        <label for="username">Admin username</label>
        <input id="username" autocomplete="username" required autofocus
               placeholder="admin username">
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" type="password" autocomplete="current-password"
               required placeholder="••••••••">
      </div>
      <button class="btn btn-primary btn-block btn-lg" id="submit" type="submit">
        Sign in to console
      </button>
    </form>

    <div class="auth-foot">
      <a href="/">← Back to site</a>
    </div>
  </div>
</div>

<script src="/static/common.js"></script>
<script>
(function () {
  const form = document.getElementById('login-form');
  const msg = document.getElementById('msg');
  const btn = document.getElementById('submit');

  if (qs('denied')) {
    showAlert(msg, 'error', 'That account is not an administrator.');
  }
  if (qs('expired')) {
    showAlert(msg, 'warn', 'Your admin session expired. Please sign in again.');
  }

  form.addEventListener('submit', async function (e) {
    e.preventDefault();
    showAlert(msg, null, null);

    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;
    if (!username || !password) {
      showAlert(msg, 'error', 'Enter your username and password.');
      return;
    }

    const done = busy(btn, 'Signing in…');
    try {
      const auth = await api('/auth/login', {
        method: 'POST', auth: false,
        body: { username: username, password: password }
      });

      // Refuse a non-admin here rather than dropping them into a console whose
      // every request would 403 anyway. Server-side checks are the real gate.
      if (!auth.user || auth.user.role !== 'admin') {
        done();
        showAlert(msg, 'error',
          'Those credentials are valid but not an administrator account.');
        return;
      }

      Auth.save(auth);
      location.replace('/superadmin/console');
    } catch (err) {
      done();
      showAlert(msg, 'error', err.message);
    }
  });
})();
</script>
</body>
</html>
